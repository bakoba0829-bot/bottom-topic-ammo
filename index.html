<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>話題の弾薬庫</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">配信ネタ支援PWA</p>
      <h1>話題の弾薬庫</h1>
    </div>
    <button id="refreshBtn" class="icon-btn" aria-label="更新">↻</button>
  </header>

  <main>
    <section class="hero">
      <div>
        <p id="todayLabel" class="muted"></p>
        <h2>今日、何しゃべる？</h2>
        <p class="muted">困った時だけ開けばOK。台本ではなく予備弾です。</p>
      </div>
      <div class="status-pill"><span id="trendStatusDot"></span><span id="trendStatusText">トレンド確認中</span></div>
    </section>

    <nav class="tabs" id="tabs">
      <button data-filter="all" class="active">今日</button>
      <button data-filter="first">初見</button>
      <button data-filter="short">切り抜き</button>
      <button data-filter="saved">今日使う</button>
      <button data-filter="favorite">お気に入り</button>
    </nav>

    <div class="genre-row" id="genreRow"></div>

    <section class="section-head">
      <div>
        <h3 id="sectionTitle">今日のおすすめ</h3>
        <p id="sectionMeta" class="muted"></p>
      </div>
      <button id="shuffleBtn" class="small-btn">シャッフル</button>
    </section>

    <section id="topicList" class="topic-list" aria-live="polite"></section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="closeModal" class="modal-close" aria-label="閉じる">×</button>
      <div id="modalContent"></div>
    </article>
  </div>

  <template id="topicCardTemplate">
    <article class="topic-card">
      <div class="card-topline">
        <span class="source-badge"></span>
        <span class="genre-badge"></span>
      </div>
      <h3 class="topic-title"></h3>
      <p class="opening"></p>
      <div class="scores"></div>
      <div class="actions">
        <button class="detail-btn primary">詳細</button>
        <button class="today-btn">＋ 今日使う</button>
        <button class="fav-btn" aria-label="お気に入り">♡</button>
      </div>
    </article>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
